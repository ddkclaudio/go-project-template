name: Build and Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Criar binários
        run: |
          mkdir dist
          GOOS=linux   GOARCH=amd64   go build -o dist/codegen-linux-amd64 .
          GOOS=windows GOARCH=amd64   go build -o dist/codegen-windows-amd64.exe .
          GOOS=darwin  GOARCH=amd64   go build -o dist/codegen-darwin-amd64 .

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "auto-${{ github.sha }}"
          name: "Build ${{ github.sha }}"
          body: "Release gerado automaticamente a partir do commit `${{ github.sha }}`."
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
